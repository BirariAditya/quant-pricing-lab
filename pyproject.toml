[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-pricing-lab"
version = "0.1.0"
description = "Reproducible European option pricing, Greeks, and Monte Carlo experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aditya Yogesh Birari"}]
dependencies = ["numpy>=1.26"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
validation = ["QuantLib>=1.35"]
dev = ["build>=1.2", "ruff>=0.9"]
plots = ["matplotlib>=3.8"]

[project.urls]
Repository = "https://github.com/BirariAditya/quant-pricing-lab"
Issues = "https://github.com/BirariAditya/quant-pricing-lab/issues"

[project.scripts]
quant-pricing-lab = "quant_pricing_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
