name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m quant_pricing_lab --paths 1000

  reference-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[validation,dev]'
      - run: ruff check .
      - run: python scripts/validate_quantlib.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: quantlib-validation
          path: results/quantlib-validation.json
